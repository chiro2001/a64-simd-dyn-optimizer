# Normalized seed recipe: interp8 horizontal 8x8 NEON dotprod (docs/41).
# Reproduces experiments/m18-interp8/imported/machine-ir.json (136 nodes).
seed: interp8-8x8
compiler: clang
target: aarch64-linux-gnu
source: third_party/x265/source/common/aarch64/filter-neon-dotprod.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ithird_party/x265/source/encoder
  - -Ibuild/x265-8-cross-make
target_function:
  mangled: _ZN4x26524interp8_horiz_pp_dotprodILi8ELi8EEEvPKhlPhli
  demangled: x265::interp8_horiz_pp_dotprod<8,8>
output:
  ll: experiments/m18-interp8/llvm-ir/interp8-8x8-dotprod-seed.ll
  json: experiments/m18-interp8/imported/machine-ir.json
