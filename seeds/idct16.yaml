# Normalized seed recipe: idct16 upstream NEON (dct-prim.cpp).
# opt_unroll strips the !llvm.loop pragma metadata and unrolls the 8
# counted self-loops via LLVM; the remaining data-dependent diamond DAG is
# imported with the structured (nested-if) importer (docs/42 G2b).
seed: idct16
compiler: clang
target: aarch64-linux-gnu
source: third_party/x265/source/common/aarch64/dct-prim.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O3
  - -std=c++11
  - -funroll-loops
  - -mllvm
  - -unroll-threshold=5000
  - -mllvm
  - -unroll-count=16
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ibuild/x265-8-cross-make
extract:
  opt_unroll: true
  inject_constants: true
  import_mode: structured
target_function:
  mangled: _ZN4x26511idct16_neonEPKsPsl
  demangled: x265::idct16_neon
output:
  ll: experiments/m30-idct16-search/llvm-ir/idct16-neon-seed.ll
  json: experiments/m30-idct16-search/imported/machine-ir.json
verify:
  codegen: emit_structured_neon_intrinsics
  harness: kernels/idct16/roundtrip_verify_neon.cpp
  lib: build/x265-8-clang-sve/libx265.a
  cases: 20000
