# Normalized seed recipe: SAO edge offset class 2 (diagonal 135deg), 64x1
# (docs/45). Reference = open-source NEON processSaoCUE2_neon.
seed: sao-e2-64
compiler: clang
target: aarch64-linux-gnu
source: kernels/sao/seed_e2.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
target_function:
  mangled: dynopt_sao_e2_64
  demangled: dynopt_sao_e2_64
output:
  ll: experiments/m30-sao-search/llvm-ir/sao-e2-64-seed.ll
  json: experiments/m30-sao-search/imported/machine-ir-e2.json
verify:
  codegen: emit_sao_e2_c_intrinsics
  func_name: dynopt_sao_e2_64_roundtrip
  harness: kernels/sao/roundtrip_verify_e2.cpp
  lib: build/x265-8-clang-sve/libx265.a
  compile_flags: ["-march=armv8.2-a+dotprod"]
  cases: 20000
