# Normalized seed recipe: dct32 upstream NEON (dct-prim.cpp).
# Force-inline the two partialButterfly32 passes
# (-inline-threshold=100000): the forward DCT has NO data-dependent
# branches and the loops fully unroll -> flat straight-line import.
seed: dct32
compiler: clang
target: aarch64-linux-gnu
source: third_party/x265/source/common/aarch64/dct-prim.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O3
  - -std=c++11
  - -funroll-loops
  - -mllvm
  - -unroll-threshold=5000
  - -mllvm
  - -unroll-count=16
  - -mllvm
  - -inline-threshold=100000
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ibuild/x265-8-cross-make
extract:
  opt_unroll: true
  inject_constants: true
  import_mode: structured
target_function:
  mangled: _ZN4x26510dct32_neonEPKsPsl
  demangled: x265::dct32_neon
output:
  ll: experiments/m30-dct32-search/llvm-ir/dct32-neon-seed.ll
  json: experiments/m30-dct32-search/imported/machine-ir.json
verify:
  codegen: emit_structured_neon_intrinsics
  func_name: dynopt_dct32_neon_roundtrip
  harness: kernels/dct32/roundtrip_verify_neon.cpp
  lib: build/x265-8-clang-sve/libx265.a
  cases: 5000
search:
  backend: op
  extra:
    - --skip-axes
    - layout,odd_lowering,narrow_batch,constant_layout,rw1,rw2,rw3,rw4
