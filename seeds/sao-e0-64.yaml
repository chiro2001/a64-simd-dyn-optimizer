# Normalized seed recipe: SAO edge offset class 0, width 64 (docs/45).
# The open-source NEON implementation is ACLE (loopfilter-prim.cpp); the
# seed is a fixed-width full-unroll specialization of the same semantics.
seed: sao-e0-64
compiler: clang
target: aarch64-linux-gnu
source: kernels/sao/seed_e0.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
target_function:
  mangled: dynopt_sao_e0_64
  demangled: dynopt_sao_e0_64
output:
  ll: experiments/m30-sao-search/llvm-ir/sao-e0-64-seed.ll
  json: experiments/m30-sao-search/imported/machine-ir.json
verify:
  codegen: emit_sao_e0_c_intrinsics
  func_name: dynopt_sao_e0_64_roundtrip
  harness: kernels/sao/roundtrip_verify_e0.cpp
  lib: build/x265-8-clang-sve/libx265.a
  compile_flags: ["-march=armv8.2-a+dotprod"]
  cases: 20000
