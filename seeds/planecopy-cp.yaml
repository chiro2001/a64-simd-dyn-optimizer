# Normalized seed recipe: planecopy_cp 64x32 (constant-shape wrapper).
seed: planecopy-cp
compiler: clang
target: aarch64-linux-gnu
source: kernels/planecopy-cp/seed.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
  - -funroll-loops
  - -mllvm
  - -unroll-threshold=5000
  - -mllvm
  - -unroll-count=64
  - -mllvm
  - -inline-threshold=100000
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ithird_party/x265/source/common/aarch64
  - -Ithird_party/x265/source/encoder
  - -Ibuild/x265-8-cross-make
target_function:
  mangled: dynopt_planecopy_cp_64x32_seed
  demangled: dynopt_planecopy_cp_64x32_seed
output:
  ll: experiments/m30-planecopy-search/llvm-ir/planecopy-cp-64x32.ll
  json: experiments/m30-planecopy-search/imported/machine-ir.json
