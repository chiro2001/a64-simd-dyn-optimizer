# Normalized seed recipe: interp8 vertical 16x16 NEON (filter-prim.cpp).
# The function is a `switch(coeffIdx)` over three tap patterns with a phi
# merge and no loops; `strip_switch_case: 1` takes the case-1 path.
seed: interp8vpp-16
compiler: clang
target: aarch64-linux-gnu
source: third_party/x265/source/common/aarch64/filter-prim.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
  - -funroll-loops
  - -mllvm
  - -unroll-threshold=5000
  - -mllvm
  - -unroll-count=16
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ithird_party/x265/source/encoder
  - -Ibuild/x265-8-cross-make
extract:
  strip_switch_case: 1
target_function:
  mangled: _ZN4x26519interp_vert_pp_neonILi8ELi16ELi16EEEvPKhlPhli
  demangled: x265::interp_vert_pp_neon<8,16,16>
output:
  ll: experiments/m30-interp8vpp-search/llvm-ir/interp8vpp-16-case1.ll
  json: experiments/m30-interp8vpp-search/imported/machine-ir-case1.json
verify:
  codegen: emit_interp8_c_intrinsics
  func_name: dynopt_interp8vpp_16x16_case1_neon_roundtrip
  harness: kernels/interp8vpp-16/roundtrip_verify_case1.cpp
  lib: build/x265-8-clang-sve/libx265.a
  compile_flags: ["-march=armv8.2-a+dotprod"]
  cases: 20000
