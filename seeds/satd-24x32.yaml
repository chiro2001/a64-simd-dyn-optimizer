# Normalized seed recipe: satd 24x32 upstream NEON (pixel-prim.cpp).
seed: satd-24x32
compiler: clang
target: aarch64-linux-gnu
source: third_party/x265/source/common/aarch64/pixel-prim.cpp
clang_args:
  - -march=armv8.2-a+dotprod
  - -O2
  - -std=c++11
  - -funroll-loops
  - -mllvm
  - -unroll-threshold=5000
  - -mllvm
  - -unroll-count=64
  - -mllvm
  - -inline-threshold=100000
  - -DHAVE_NEON=1
  - -DHAVE_NEON_DOTPROD=1
  - -DX265_ARCH_ARM64=1
  - -DENABLE_ASSEMBLY=1
  - -DHIGH_BIT_DEPTH=0
  - -DX265_DEPTH=8
  - -DX265_NS=x265
  - -Ithird_party/x265/source
  - -Ithird_party/x265/source/common
  - -Ithird_party/x265/source/encoder
  - -Ibuild/x265-8-cross-make
target_function:
  mangled: _ZN12_GLOBAL__N_110satd8_neonILi24ELi32EEEiPKhlS2_l
  demangled: (anonymous namespace)::satd8_neon<24,32>
output:
  ll: experiments/m30-satd-search/llvm-ir/satd-24x32-seed.ll
  json: experiments/m30-satd-search/imported/machine-ir-24x32.json
