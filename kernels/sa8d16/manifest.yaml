# SA8D 16x16 SVE2 kernel manifest. At VL=256 a 16-pixel row is one natural
# 16-lane register, so unlike the 8x8 pack variants there is no packing /
# half-extraction / TBL2 / rotation overhead: every stage processes the
# left/right 8x8 quadrants simultaneously and the upstream 128-bit count
# (373 fused) should be truly halved (~180).
kernel: sa8d16
contract: upstream-exact
vl_bytes: 32
shape:
  kind: sa8d
  n: 16

candidate:
  symbol: dynopt_sa8d_16x16_sve2
  verify_src: kernels/sa8d/sve_verify.cpp
  trace_driver_src: kernels/sa8d16/trace_driver.cpp
  trace_driver_c: kernels/sa8d16/trace_driver.cpp

reference:
  lib: build/x265-8-clang-sve/libx265.a
  symbol: sa8d16_sve2
  symbol_mangled: _ZN4x26511sa8d16_sve2ILi16ELi16EEEiPKhlS2_l
  call: x265::sa8d16_sve2<16, 16>
  decl: |
    namespace x265 {
    template <int W, int H> int sa8d16_sve2(
        const uint8_t*, intptr_t, const uint8_t*, intptr_t);
    }

baselines:
  sve2:
    driver: kernels/sa8d16/trace_driver.cpp
    symbol_mangled: _ZN4x26511sa8d16_sve2ILi16ELi16EEEiPKhlS2_l

corpus:
  # 16x16 rows are 16 bytes; stride must be >= 16 so one unpredicated
  # 16-byte load reads exactly the block's row (stride 8 would overlap rows).
  strides: [16, 17, 32, 64]
  value_range: [0, 255]
  cases: 20000

targets:
  baseline_fused_uop: 373
  halve_gate: 0.5

layouts:
  # 2026-08-15: 920B target covers both ISA pipes. load=sve keeps the
  # natural SVE1 16-lane candidate; load=mixed is SVE1 wide load/diff +
  # NEON Hadamard; load=neon is the pure-NEON 16x16 emitter (reduce_mix/
  # quad axes). The sve1 ISA filter allows all three (NEON is baseline).
  load: [sve, mixed, neon]
  reduce_mix: [vaddlv, vpadal, vaddv]
  quad: [seq, pair]
  pack: [1, 2]
  reduce: [sve]
  # 2026-08-14: tail-reduction axis (saddv passes the halve gate 186;
  # dot-uaddv is the 189 baseline shape).
  reduce_tail: [saddv, dot-uaddv, neon]

# Pure-NEON search axes (used by --isa neon; the SVE axes above are SVE
# layout values and would be filtered out by the NEON value gate).
layouts_neon:
  reduce: [vpadal, vaddlv, vaddv]
  quad: [seq, pair]
