# DCT32 SVE2 kernel manifest. Reference = upstream x265::dct32_sve
# (128-bit-style SVE, fused_uop 12710 at VL=256); v1 candidate is a
# 16-lane SVE2 port (upstream-exact) establishing the pipeline before the
# constant-rearrangement optimization iterations.
kernel: dct32
contract: upstream-exact
vl_bytes: 32
shape:
  n: 32

candidate:
  symbol: dynopt_dct32_sve2_shared
  # pass32_impl is a local symbol (mangled); leaf32 is inlined into it. The
  # wrapper sits after it, so tracing from pass32_impl covers the real work.
  # v3 instantiates pass32_impl<4>/<11> (noinline): trace from the <4> one.
  range_start: [_ZL11pass32_implPKsPsli, _Z11pass32_implILi4EEvPKsPsl]
  # 2026-08-13 口径修正: range_start 只覆盖 pass1，full-kernel 必须扩到
  # wrapper 结束（pass1+pass2+wrapper），否则 fused_uop 少算一半以上。
  range_end: dynopt_dct32_sve2_shared
  verify_src: kernels/dct16/sve_shared_verify.cpp
  trace_driver_src: kernels/dct32/trace_driver.cpp
  trace_driver_c: kernels/dct32/trace_driver.cpp

reference:
  lib: build/x265-8-clang-sve/libx265.a
  symbol: dct32_sve
  symbol_mangled: _ZN4x2659dct32_sveEPKsPsl
  call: x265::dct32_sve
  decl: |
    namespace x265 {
    void dct32_sve(const int16_t*, int16_t*, intptr_t);
    }

baselines:
  sve:
    driver: kernels/dct32/trace_driver_upstream.cpp
    symbol_mangled: _ZN4x2659dct32_sveEPKsPsl

corpus:
  strides: [16, 17, 32]
  value_range: [-255, 255]
  cases: 20000

targets:
  # Round-0010/用户口径: 上游是 128-bit 算法，SVE256 候选必须把 fused_uop
  # 压到基线的半数以下才算“真减半”（硬门）。内部参考 4251/4827 是超越目标。
  baseline_fused_uop: 12710
  halve_gate: 0.5

# 用户确认口径 (2026-08-14): 目标机流水线 = SVE 2x256 / NEON 4x128
# （SVE 2 条 256-bit 执行管道、NEON 4 条 128-bit 管道，VL=256）。
# LLVM 暂无该模型，当前用 neoverse-v2 作为 cycle 代理；920B 实测表
# 接入后替换为自定义模型（docs/26）。
mca_target:
  name: kunpeng920-sve2x256
  sve_pipes: 2
  sve_vl_bits: 256
  neon_pipes: 4
  neon_vl_bits: 128
  vl_bytes: 32
  llvm_proxy_cpu: neoverse-v2
  llvm_proxy_mattr: +sve2

# 2026-08-14: generic axis dependencies (P2). k0 axes only apply when
# k0_even_sve is active; k0_merge8 needs row_group=8/16. row_group=16 is
# normalized to slice_kind=zip inside the op lowering (k4 tbl2 slices are
# tied to even/odd banks, docs/20 §5.13), so no prune rule is needed.
layout_prune:
  - {axis: k0_shared_mul, requires: {k0_even_sve: 1}}
  - {axis: k0_merge8, requires: {k0_even_sve: 1, row_group: [8, 16]}}
  - {axis: k0_epack, requires: {k0_even_sve: 1}}
  # 2026-08-14 (m32 probe): k0 store without tbl2
  # (uzp1_s32(k0p_a,k0p_b) concat + rshrnb + uzp1_s16 -> st1h8).
  # Requires the non-shared-mul k0p layout; the 4-input 16-lane variant
  # was a negative result (GCC spills, m32).
  - {axis: k0_merge16, requires: {k0_even_sve: 1, row_group: [8, 16],
                                  k0_shared_mul: 0}}
  - {axis: k0_merge8, requires: {k0_merge16: 0}}

layouts:
  layout: [v1, v2, v2b, v3]
  # round-0012 P0: v3.1 的 pass1 k≡2 切片拆成独立轴（0=4266, 1=3962）；
  # 对 v1/v2/v2b 无效果（源码哈希去重）。
  pass1_k2_slice: [0, 1]
  # round-0012 P0: odd-k lowering 轴（sdot.d = lane-per-output 4 行切片；
  # row-reduce = v2 风格逐行 16-term dot+uaddv）。
  odd_lowering: [sdot.d, row-reduce]
  # round-0012 P0: odd 路径窄化批次（4 = uzp1+rshrnb+uzp1 批处理；
  # 1 = 逐输出标量舍入，消融用）。
  narrow_batch: [1, 4]
  # round-0012 P0: odd 常量布局（derived-replicated = CODD 预复制切片；
  # canonical = 运行时 4 条 TBL 复制原始 C32，消融“常量吸收”机制）。
  constant_layout: [derived-replicated, canonical]
  # 2026-08-13: sdot.d 累加链拆分（1=4 连链 v3.1；2=2+2 独立链+add；
  # 4=4 独立 sdot+树状 add）。针对实机“指令数不转化周期”的 ILP 假设。
  acc_split: [1, 2, 4]
  # isa (sve1/sve2) 暂为发射器手工选项，不进入搜索轴（编译 flag 不同，
  # 避免搜索空间翻倍；SVE1 变体由 --isa sve1 单独生成/验证）。
  # 2026-08-13（用户放开 legacy-internal-exact，黄金标准=TestBenchLite）：
  # pass2 k2（legacy_ex）与 k4（legacy_k4）走 s16 切片 + sdot.d；
  # op backend 已实现并验证（7724），grouped 只实现 legacy_ex。
  legacy_ex: [0, 1]
  legacy_k4: [0, 1]
  # 2026-08-13: 切片实现（tbl2 = 原 12 TBL/组；zip = 10 固定
  # zip/trn d-lane 转置，7724→7222）。仅 op backend 消费，grouped 忽略。
  slice_kind: [tbl2, zip]
  # 2026-08-13: 行分组（4 = 单 bank；8 = 偶/奇双 bank + trn1 合并窄化，
  # 6691→6520）。仅 op backend 消费，grouped 忽略。
  row_group: [4, 8, 16]
  # 2026-08-13: k0 even_sve（仅 op backend；要求 legacy_ex+legacy_k4）：
  # k0 family 走 4 行 quarter + EEp/EOp + mul/addp，替换 s32 E 链 +
  # 标量 extract2 路径。
  k0_even_sve: [0, 1]
  # 2026-08-14: k0_shared_mul（仅 op backend；要求 k0_even_sve=1）：
  # k0/k16 共享 EEp×64 一次 mul，用 uzp1s/uzp2s+add/sub 同时得到两族
  # （内部参考 32 mul / 0 addp 特征）；k8/k24 的 (83,36)/(36,-83)
  # 无公因子，保留逐 k mul 路径。
  k0_shared_mul: [0, 1]
  # 2026-08-14: k0_merge8（仅 op backend；要求 k0_even_sve=1 +
  # row_group=8/16）：每对 4 行 pack 的逐 k 4-lane 向量用 tbl2_s32 合并，
  # 一次 rshrnb+uzp1+store8（row8：-32 store/-32 narrow，+32 tbl2；
  # row16 对 4 个 pack 两两合并）。
  k0_merge8: [0, 1]
  k0_merge16: [0, 1]
  # 2026-08-14: k0_epack（仅 op backend；要求 k0_even_sve=1）：
  # 先按行算 E=lo+rev(hi)（s16 精确，pass2 E 值 < 2^15 无回绕），
  # 单次 pack E（替代 lo/hi 双 pack 36 ops）+ 单 saddlb/lt 四项
  # （替代 8 saddl+4 add），每 pack 减 18 ops；探针两阶段 0 失配。
  k0_epack: [0, 1]
  # 2026-08-14: sdot_indexed（仅 op backend）：SVE1 indexed SDOT
  # （Zda.D, Zn.H, Zm.H[0/1]）把两个 k 族的 4 系数组打包进一个
  # 16-lane 常量向量（[kA c0..3, kB c0..3, kA c0..3, kB c0..3]，
  # 索引在每 128-bit 段内选同一 64-bit 组），常量加载减半。
  sdot_indexed: [0, 1]
  # 2026-08-14: odd_from_k0packs（仅 op backend；要求 k0_even_sve=1）：
  # pass2 的 k0 pack(hi) 换成 pack(rv)（e 链配对等价，探针验证），
  # odd 切片用 L_q - R_q 子（+revh 恢复 2/3 顺序），替代每 bank
  # build_slices 的 10 条 zip/trn。
  odd_from_k0packs: [0, 1]
  # 2026-08-14: k2k4_from_packs（仅 op backend；要求 k0_even_sve=1 +
  # odd_from_k0packs=1）：k2/k4 切片从 k0 的 L/R pack 派生
  # （t0..t3 = E16-pack 切片；k2 EX0=t0-t3/EX1=t1-t2；
  # k4 Xk4=(t0+t3)-revh(t1+t2)，探针验证），pass2 leaf 的
  # E16/EO16/EE16/EEO16 链整体 DCE。
  k2k4_from_packs: [0, 1]
  # 2026-08-13: op 级原子 rewrite 序列（P0），最多 4 步、按 rw1..rw4
  # 顺序应用。完整序列 [legacy_k2, legacy_k4, merge_narrow8,
  # tbl2_to_zip] 从基础 plan 重发现 6456。
  rw1: [none, tbl2_to_zip, legacy_k2, legacy_k4, merge_narrow8]
  rw2: [none, tbl2_to_zip, legacy_k2, legacy_k4, merge_narrow8]
  rw3: [none, tbl2_to_zip, legacy_k2, legacy_k4, merge_narrow8]
  rw4: [none, tbl2_to_zip, legacy_k2, legacy_k4, merge_narrow8]

# 2026-08-13: 发射器新增 isa 轴（sve1/sve2 降级），SVE1 变体见
# candidates/best_sve1.{cpp,S,o}（同符号 dynopt_dct32_sve2_shared，
# 920B SVE1/VL=256 可跑，20k 差分 0，p50=226 vs 上游 222）。

# 2026-08-14: op 后端 row16 legacy 最优候选
# candidates/best_op_r16.{cpp,S}（-O2 -fno-tree-pre，4002 full，
# TestBenchLite 5 seed PASS；生成：layout_ir.dct32_v31_plan +
# lowering legacy_ex/k4=1, slice_kind=zip, row_group=16,
# k0_even_sve=1, k0_merge8=1, k0_shared_mul=0, k0_epack=1,
# sdot_indexed=1, odd_from_k0packs=1, k2k4_from_packs=1）。
