# DCT32 SVE2 kernel manifest. Reference = upstream x265::dct32_sve
# (128-bit-style SVE, fused_uop 12710 at VL=256); v1 candidate is a
# 16-lane SVE2 port (upstream-exact) establishing the pipeline before the
# constant-rearrangement optimization iterations.
kernel: dct32
contract: upstream-exact
vl_bytes: 32
shape:
  n: 32

candidate:
  symbol: dynopt_dct32_sve2_shared
  # pass32_impl is a local symbol (mangled); leaf32 is inlined into it. The
  # wrapper sits after it, so tracing from pass32_impl covers the real work.
  # v3 instantiates pass32_impl<4>/<11> (noinline): trace from the <4> one.
  range_start: [_ZL11pass32_implPKsPsli, _Z11pass32_implILi4EEvPKsPsl]
  # 2026-08-13 口径修正: range_start 只覆盖 pass1，full-kernel 必须扩到
  # wrapper 结束（pass1+pass2+wrapper），否则 fused_uop 少算一半以上。
  range_end: dynopt_dct32_sve2_shared
  verify_src: kernels/dct16/sve_shared_verify.cpp
  trace_driver_src: kernels/dct32/trace_driver.cpp
  trace_driver_c: kernels/dct32/trace_driver.cpp

reference:
  lib: build/x265-8-clang-sve/libx265.a
  symbol: dct32_sve
  symbol_mangled: _ZN4x2659dct32_sveEPKsPsl
  call: x265::dct32_sve
  decl: |
    namespace x265 {
    void dct32_sve(const int16_t*, int16_t*, intptr_t);
    }

baselines:
  sve:
    driver: kernels/dct32/trace_driver_upstream.cpp
    symbol_mangled: _ZN4x2659dct32_sveEPKsPsl

corpus:
  strides: [16, 17, 32]
  value_range: [-255, 255]
  cases: 20000

targets:
  # Round-0010/用户口径: 上游是 128-bit 算法，SVE256 候选必须把 fused_uop
  # 压到基线的半数以下才算“真减半”（硬门）。内部参考 4251/4827 是超越目标。
  baseline_fused_uop: 12710
  halve_gate: 0.5

layouts:
  layout: [v1, v2, v2b, v3]
  # round-0012 P0: v3.1 的 pass1 k≡2 切片拆成独立轴（0=4266, 1=3962）；
  # 对 v1/v2/v2b 无效果（源码哈希去重）。
  pass1_k2_slice: [0, 1]
  # round-0012 P0: odd-k lowering 轴（sdot.d = lane-per-output 4 行切片；
  # row-reduce = v2 风格逐行 16-term dot+uaddv）。
  odd_lowering: [sdot.d, row-reduce]
  # round-0012 P0: odd 路径窄化批次（4 = uzp1+rshrnb+uzp1 批处理；
  # 1 = 逐输出标量舍入，消融用）。
  narrow_batch: [1, 4]
  # round-0012 P0: odd 常量布局（derived-replicated = CODD 预复制切片；
  # canonical = 运行时 4 条 TBL 复制原始 C32，消融“常量吸收”机制）。
  constant_layout: [derived-replicated, canonical]
  # 2026-08-13: sdot.d 累加链拆分（1=4 连链 v3.1；2=2+2 独立链+add；
  # 4=4 独立 sdot+树状 add）。针对实机“指令数不转化周期”的 ILP 假设。
  acc_split: [1, 2, 4]
  # isa (sve1/sve2) 暂为发射器手工选项，不进入搜索轴（编译 flag 不同，
  # 避免搜索空间翻倍；SVE1 变体由 --isa sve1 单独生成/验证）。
  # 2026-08-13（用户放开 legacy-internal-exact，黄金标准=TestBenchLite）：
  # pass2 k2（legacy_ex）与 k4（legacy_k4）走 s16 切片 + sdot.d；
  # op backend 已实现并验证（7724），grouped 只实现 legacy_ex。
  legacy_ex: [0, 1]
  legacy_k4: [0, 1]
  # 2026-08-13: 切片实现（tbl2 = 原 12 TBL/组；zip = 10 固定
  # zip/trn d-lane 转置，7724→7222）。仅 op backend 消费，grouped 忽略。
  slice_kind: [tbl2, zip]

# 2026-08-13: 发射器新增 isa 轴（sve1/sve2 降级），SVE1 变体见
# candidates/best_sve1.{cpp,S,o}（同符号 dynopt_dct32_sve2_shared，
# 920B SVE1/VL=256 可跑，20k 差分 0，p50=226 vs 上游 222）。
