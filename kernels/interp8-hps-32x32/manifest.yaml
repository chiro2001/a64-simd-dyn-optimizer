# interp8 luma_hps 32x32: pixel -> int16 horizontal 8-tap filter.
# First slice contract is isRowExt == 0; coeffIdx sweeps 1..3.
kernel: interp8-hps-32x32
contract: upstream-exact
vl_bytes: 32
shape:
  kind: interp8_hps
  n: 32
  rows: 32

candidate:
  symbol: dynopt_interp8_hps_32x32_sve2
  trace_driver_src: kernels/interp8-hps-32x32/trace_driver.cpp
  trace_driver_c: kernels/interp8-hps-32x32/trace_driver.cpp

reference:
  lib: build/x265-8-clang-sve/libx265.a
  symbol: interp_horiz_ps_neon
  symbol_mangled: _ZN4x26520interp_horiz_ps_neonILi8ELi32ELi32EEEvPKhlPslii
  call: x265::interp_horiz_ps_neon<8, 32, 32>
  decl: |
    namespace x265 {
    template <int N, int W, int H> void interp_horiz_ps_neon(
        const uint8_t*, intptr_t, int16_t*, intptr_t, int, int);
    }

baselines:
  neon:
    driver: kernels/interp8-hps-32x32/trace_driver.cpp
    symbol_mangled: _ZN4x26520interp_horiz_ps_neonILi8ELi32ELi32EEEvPKhlPslii

corpus:
  strides: [16, 32, 64]
  cases: 20000

layouts:
  compute: [sdot-d]

mca_target:
  default: NP1
  llvm_proxy_cpu: neoverse-v2
  llvm_proxy_mattr: "+sve2"
