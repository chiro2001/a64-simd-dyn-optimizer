# 8-bit horizontal 8-tap luma filter (interp8), 8x8, SVE2 (VL=256).
# Reference = upstream x265::interp_horiz_pp_neon<8,8,8> (dispatches to
# interp8_horiz_pp_neon<1/2/3,8,8>); contract = upstream-exact for all
# three phases.
kernel: interp8
contract: upstream-exact
vl_bytes: 32
shape:
  kind: interp8
  n: 8

candidate:
  symbol: dynopt_interp8_8x8_sve2
  trace_driver_src: kernels/interp8/trace_driver.cpp
  trace_driver_c: kernels/interp8/trace_driver.cpp

# SVE2p3 path-B (sdot.h, needs custom QEMU with patches/qemu-sve2p3-sdot-btoh.patch).
# docs/22 §5.3: fused 101 (clang) / 100 (GCC) vs upstream 141, lite PASS,
# 20k upstream-exact. Same function signature as `candidate`.
candidate_sve2p3:
  symbol: dynopt_interp8_8x8_sve2_sdoth
  march: armv9.4-a+sve2p3
  trace_driver_src: kernels/interp8/trace_driver.cpp
  sources: [candidates/best_sve2_sdoth.cpp, candidates/best_sve2_sdoth.o]

reference:
  lib: build/x265-8-clang-sve/libx265.a
  symbol: interp_horiz_pp_neon
  symbol_mangled: _ZN4x26520interp_horiz_pp_neonILi8ELi8ELi8EEEvPKhlPhli
  call: x265::interp_horiz_pp_neon<8, 8, 8>
  decl: |
    namespace x265 {
    template <int N, int W, int H> void interp_horiz_pp_neon(
        const uint8_t*, intptr_t, uint8_t*, intptr_t, int);
    }

baselines:
  neon:
    driver: kernels/interp8/trace_driver.cpp
    symbol_mangled: _ZN4x26520interp_horiz_pp_neonILi8ELi8ELi8EEEvPKhlPhli

corpus:
  strides: [16, 32, 64]
  cases: 20000

targets:
  baseline_fused_uop: 141
  halve_gate: 0.5

layouts:
  path: [a]
  # compute=sdot-h is the SVE2p3 path-B (needs the custom QEMU build,
  # DYNOPT_QEMU_SVE2P3 default build/qemu-build/qemu-aarch64, and the
  # patched llvm-mca for MCA; docs/22 §5.3 / docs/29).
  compute: [sdot-d, sdot-h]
