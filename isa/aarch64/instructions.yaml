# AArch64 instruction database for semantic-pattern -> instruction selection.
# `feature` gates emission via optimizer.targets.aarch64.features.TargetFeatures.
# `status: verify` means the intrinsic/encoding must be confirmed on the target
# toolchain before a generated candidate may enter the benchmark funnel.

instructions:
  # ---- NEON (ASIMD, 128-bit) ----
  - {id: neon-add-s16x8, feature: neon, intrinsic: vaddq_s16,
     pattern: {op: add, lanes: 8, bits: 16}, status: known}
  - {id: neon-sub-s16x8, feature: neon, intrinsic: vsubq_s16,
     pattern: {op: sub, lanes: 8, bits: 16}, status: known}
  - {id: neon-abs-s16x8, feature: neon, intrinsic: vabsq_s16,
     pattern: {op: abs, lanes: 8, bits: 16}, status: known}
  - {id: neon-sabd-s16x8, feature: neon, intrinsic: vabdq_s16,
     pattern: {op: sabd, lanes: 8, bits: 16}, status: known}
  - {id: neon-umax-u16x8, feature: neon, intrinsic: vmaxq_u16,
     pattern: {op: umax, lanes: 8, bits: 16}, status: known}
  - {id: neon-umaxp-u16x8, feature: neon, intrinsic: vpmaxq_u16,
     pattern: {op: umaxp, lanes: 8, bits: 16}, status: known}
  - {id: neon-trn1-2d-s16x8, feature: neon, intrinsic: vtrn1q_s64,
     pattern: {op: fold-lo, lanes: 8, bits: 16}, status: known}
  - {id: neon-trn2-2d-s16x8, feature: neon, intrinsic: vtrn2q_s64,
     pattern: {op: fold-hi, lanes: 8, bits: 16}, status: known}
  - {id: neon-trn1-s16x8, feature: neon, intrinsic: vtrn1q_s16,
     pattern: {op: trn1, lanes: 8, bits: 16}, status: known}
  - {id: neon-trn2-s16x8, feature: neon, intrinsic: vtrn2q_s16,
     pattern: {op: trn2, lanes: 8, bits: 16}, status: known}
  - {id: neon-trn1-s32x4, feature: neon, intrinsic: vtrn1q_s32,
     pattern: {op: trn1, lanes: 4, bits: 32}, status: known}
  - {id: neon-trn2-s32x4, feature: neon, intrinsic: vtrn2q_s32,
     pattern: {op: trn2, lanes: 4, bits: 32}, status: known}
  - {id: neon-vext-s16x8, feature: neon, intrinsic: vextq_s16,
     pattern: {op: ext, lanes: 8, bits: 16}, status: known}
  - {id: neon-zip1-s16x8, feature: neon, intrinsic: vzip1q_s16,
     pattern: {op: zip1, lanes: 8, bits: 16}, status: known}
  - {id: neon-zip2-s16x8, feature: neon, intrinsic: vzip2q_s16,
     pattern: {op: zip2, lanes: 8, bits: 16}, status: known}
  - {id: neon-uzp1-s16x8, feature: neon, intrinsic: vuzp1q_s16,
     pattern: {op: uzp1, lanes: 8, bits: 16}, status: known}
  - {id: neon-uzp2-s16x8, feature: neon, intrinsic: vuzp2q_s16,
     pattern: {op: uzp2, lanes: 8, bits: 16}, status: known}
  - {id: neon-uaddlv-u16x8, feature: neon, intrinsic: vaddlvq_u16,
     pattern: {op: uaddlv, lanes: 8, bits: 16}, status: known}
  - {id: neon-usubl-u8x8, feature: neon, intrinsic: vsubl_u8,
     pattern: {op: usubl, lanes: 8, bits: 8}, status: known}
  - {id: neon-ld1-u8x8, feature: neon, intrinsic: vld1_u8,
     pattern: {op: load, lanes: 8, bits: 8}, status: known}
  - {id: neon-ld1q-u8x16, feature: neon, intrinsic: vld1q_u8,
     pattern: {op: load, lanes: 16, bits: 8}, status: known}
  - {id: neon-add-scalar-u32, feature: neon, intrinsic: null,
     pattern: {op: add, lanes: 1, bits: 32}, status: known}
  - {id: neon-lshr-scalar-u32, feature: neon, intrinsic: null,
     pattern: {op: lshr, lanes: 1, bits: 32}, status: known}

  # ---- SVE (scalable, predicated) ----
  - {id: sve-add-u16, feature: sve, intrinsic: svadd_u16_x,
     pattern: {op: add, pred: true}, status: known}
  - {id: sve-sub-u16, feature: sve, intrinsic: svsub_u16_x,
     pattern: {op: sub, pred: true}, status: known}
  - {id: sve-abs-s16, feature: sve, intrinsic: svabs_s16_x,
     pattern: {op: abs, pred: true}, status: known}
  - {id: sve-sabd-s16, feature: sve, intrinsic: svabd_s16_x,
     pattern: {op: sabd, pred: true}, status: known}
  - {id: sve-umax-u16, feature: sve, intrinsic: svmax_u16_x,
     pattern: {op: umax, pred: true}, status: known}
  - {id: sve-umaxp-u16, feature: sve, intrinsic: svmaxp_u16,
     pattern: {op: umaxp, pred: true}, status: verify}
  - {id: sve-zip1-u16, feature: sve, intrinsic: svzip1_u16,
     pattern: {op: zip1, pred: false}, status: known}
  - {id: sve-zip2-u16, feature: sve, intrinsic: svzip2_u16,
     pattern: {op: zip2, pred: false}, status: known}
  - {id: sve-tbl-u16, feature: sve, intrinsic: svtbl_u16,
     pattern: {op: tbl, pred: false}, status: known}
  - {id: sve-uaddv-u16, feature: sve, intrinsic: svuaddv_u16,
     pattern: {op: uaddv, pred: true}, status: known}
  - {id: sve-ld1ub, feature: sve, intrinsic: svld1ub_u32,
     pattern: {op: load, pred: true}, status: known}
  - {id: sve-whilelt, feature: sve, intrinsic: svwhilelt_b32,
     pattern: {op: whilelt, pred: true}, status: known}

  # ---- SVE2 ----
  - {id: sve2-tbl2-u16, feature: sve2, intrinsic: svtbl2_u16,
     pattern: {op: tbl2, pred: false}, status: verify}
  - {id: sve2-umaxp-u16, feature: sve2, intrinsic: svmaxp_u16,
     pattern: {op: umaxp, pred: true}, status: verify}
  - {id: sve2-histcnt-u32, feature: sve2, intrinsic: svhistcnt_u32,
     pattern: {op: histcnt, pred: true}, status: verify}

  # ---- SVE2p3 (placeholder; confirm ACLE names on toolchain) ----
  - {id: sve2p3-placeholder, feature: sve2p3, intrinsic: null,
     pattern: {op: placeholder}, status: verify}
